name: Renovate

on:
  schedule:
    - cron: '0 5 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.5
        env:
          RENOVATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          configurationFile: renovate.json
